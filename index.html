<style>

  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 9px;font-size:12.5px;color:var(--sub)}

/* ---------------- 지역 탐색: 주요 12 · 서울/경기/인천 → 구 → 동 → 단지 ---------------- */
const rgridEl = document.getElementById("rgrid");
const rtabsEl = document.getElementById("rtabs");
const crumbEl = document.getElementById("crumb");
const cxlistEl = document.getElementById("cxlist");

const regionsOf = a => PD.regions.map((r,i)=>({...r,i})).filter(r => r.a === a);
const dongsOf  = ri => PD.dongs[String(ri)] || [];
const cxOf     = (ri, di) => PD.cx[ri + ":" + di] || [];
const areaCount = a => regionsOf(a).length;

const RTABS = [
  { key:"pop", label:"주요", n: POPULAR.length },
  { key:"서울", label:"서울", n: areaCount("서울") },
  { key:"경기", label:"경기", n: areaCount("경기") },
  { key:"인천", label:"인천", n: areaCount("인천") }
];
const RSTATE = { tab:"pop", ri:-1, di:-1 };

/* 전체 단지 인덱스 — 검색용 */
const CXFLAT = [];
for (const k in PD.cx){
  const [ri, di] = k.split(":").map(Number);
  for (const c of PD.cx[k]) CXFLAT.push({ n:c[0], ri, di, hh:c[1]||0 });
}
CXFLAT.sort((a,b)=>b.hh-a.hh);

function gridCell(label, kind, val, grp){
  const href = PAGES["01"] + "?v=" + BUILD + "#" + (kind==="area" ? "area=" : "region=") + encodeURIComponent(val);
  return `<a class="rc${grp?" grp":""}" href="${href}">${esc(label)}</a>`;
}
function dongCell(name){
  return `<button class="rc" type="button" data-dong="${esc(name)}">${esc(name)}</button>`;
}
function regionCell(r){
  return `<button class="rc" type="button" data-ri="${r.i}">${esc(r.n)}</button>`;
}

function paintTabs(){
  rtabsEl.innerHTML = RTABS.map(t =>
    `<button class="rtab${t.key===RSTATE.tab?" on":""}" type="button" role="tab" aria-selected="${t.key===RSTATE.tab}"
       data-k="${t.key}">${t.label}<b>${t.n}</b></button>`).join("");
}

function paintCrumb(){
  if (RSTATE.ri < 0){ crumbEl.innerHTML = ""; return; }
  const r = PD.regions[RSTATE.ri];
  const dn = RSTATE.di >= 0 ? dongsOf(RSTATE.ri)[RSTATE.di] : null;
  const path = dn
    ? `<span>${esc(r.a)}</span><span class="sp">›</span><b>${esc(r.n)}</b><span class="sp">›</span><b>${esc(dn)}</b>`
    : `<span>${esc(r.a)}</span><span class="sp">›</span><b>${esc(r.n)}</b>`;
  const open = dn
    ? `${PAGES["01"]}?v=${BUILD}#region=${encodeURIComponent(r.n)}&dong=${encodeURIComponent(dn)}`
    : `${PAGES["01"]}?v=${BUILD}#region=${encodeURIComponent(r.n)}`;
  const btnLabel = dn ? `${dn} 전체 대시보드 열기` : `${r.n} 전체 대시보드 열기`;
  crumbEl.innerHTML = `<div class="crumb"><button class="bk" type="button" id="rback" aria-label="뒤로">←</button>`
    + `<span class="path">${path}</span></div>`
    + `<a class="ropen" href="${open}">${esc(btnLabel)} ↗</a>`;
  const bk = document.getElementById("rback");
  if (bk) bk.onclick = () => { if (RSTATE.di >= 0) RSTATE.di = -1; else { RSTATE.ri = -1; } paintRegion(); };
}

function paintGrid(){
  const list = cxlistEl;
  list.hidden = true; rgridEl.style.display = "grid";
  if (RSTATE.ri < 0){
    if (RSTATE.tab === "pop"){
      rgridEl.innerHTML = gridCell("서울 전체","area","서울",1) + gridCell("경기 전체","area","경기",1)
        + gridCell("인천 전체","area","인천",1)
        + POPULAR.map(n => { const i = PD.regions.findIndex(r => r.n === n); return i>=0 ? regionCell({...PD.regions[i], i}) : ""; }).join("");
    } else {
      rgridEl.innerHTML = gridCell(RSTATE.tab + " 전체","area",RSTATE.tab,1)
        + regionsOf(RSTATE.tab).map(regionCell).join("");
    }
    return;
  }
  if (RSTATE.di < 0){
    rgridEl.innerHTML = dongsOf(RSTATE.ri).map(dongCell).join("");
    return;
  }
  // 단지 목록
  const r = PD.regions[RSTATE.ri], dn = dongsOf(RSTATE.ri)[RSTATE.di];
  const rows = cxOf(RSTATE.ri, RSTATE.di);
  rgridEl.style.display = "none";
  list.hidden = false;
  if (!rows.length){
    list.innerHTML = `<div class="cxrow" style="cursor:default"><span class="nm" style="color:var(--sub)">`
      + `이 동은 포털에 수록된 단지가 없습니다 — 상세 대시보드에서 확인하세요.</span></div>`;
    return;
  }
  list.innerHTML = rows.slice().sort((a,b)=>(b[1]||0)-(a[1]||0)).map(([n,hh]) =>
    `<button class="cxrow" type="button" data-cx="${esc(n)}">`
      + `<span class="nm">${esc(n)}</span>`
      + `<span class="hh">${hh ? Number(hh).toLocaleString()+"세대" : ""}</span>`
      + `<span class="go">↗</span></button>`).join("");
  list.scrollTop = 0;
}

function paintRegion(){
  paintTabs(); paintCrumb(); paintGrid();
  try{ sessionStorage.setItem("rstate", JSON.stringify(RSTATE)); }catch(e){}
}
/* 앱에서 '뒤로'로 돌아왔을 때 마지막 탐색 단계 유지 */
try{
  const saved = JSON.parse(sessionStorage.getItem("rstate") || "null");
  if (saved && typeof saved.tab === "string" && RTABS.some(t => t.key === saved.tab)){
    RSTATE.tab = saved.tab;
    if (saved.ri >= 0 && saved.ri < PD.regions.length){
      RSTATE.ri = saved.ri;
      const dl = dongsOf(RSTATE.ri);
      RSTATE.di = (saved.di >= 0 && saved.di < dl.length) ? saved.di : -1;
    }
  }
}catch(e){}

rtabsEl.addEventListener("click", e => {
  const b = e.target.closest(".rtab"); if (!b) return;
  RSTATE.tab = b.dataset.k; RSTATE.ri = -1; RSTATE.di = -1; paintRegion();
});
rgridEl.addEventListener("click", e => {
  const rb = e.target.closest("[data-ri]");
  if (rb){ RSTATE.ri = +rb.dataset.ri; RSTATE.di = -1; paintRegion(); return; }
  const db = e.target.closest("[data-dong]");
  if (db){
    const idx = dongsOf(RSTATE.ri).indexOf(db.dataset.dong);
    if (idx >= 0){ RSTATE.di = idx; paintRegion(); }
  }
});
cxlistEl.addEventListener("click", e => {
  const row = e.target.closest("[data-cx]"); if (!row) return;
  const r = PD.regions[RSTATE.ri], dn = dongsOf(RSTATE.ri)[RSTATE.di];
  location.href = PAGES["04"] + "?v=" + BUILD + "#ind=29&region=" + encodeURIComponent(r.n)
    + "&dong=" + encodeURIComponent(dn) + "&q=" + encodeURIComponent(row.dataset.cx);
});
paintRegion();

      + `<span class="tbox">${svg(ic)}</span><span class="tlab">${esc(label)}</span></a>`;
  }).join("");
  const cnt = cat.items.filter(x=>x[0]!==null).length + (cat.no==="05" ? 1 : 0);
  return `<section class="sec c${parseInt(cat.no,10)}">`
    + `<div class="sechd"><span class="no">${cat.no}</span><h3>${esc(cat.title)}</h3>`
    + `<span class="cnt">${cnt}개</span>`
    + `<a class="more" href="${PAGES[cat.no]}?v=${BUILD}">전체 보기 →</a></div>`
    + `<div class="tiles">${tiles}</div></section>`;
}).join("");

/* ---------------- 검색 ---------------- */
const qEl = document.getElementById("q");
const sdEl = document.getElementById("sd");
const slEl = document.getElementById("sl");
const clrEl = document.getElementById("qclear");
let results = [], cur = -1;

function find(k){
  k = k.trim().toLowerCase();
  if(!k) return [];
  const regs = [], dngs = [], cxs = [];
  PD.regions.forEach((r,i)=>{ if(r.n.toLowerCase().includes(k)) regs.push({t:"r", n:r.n, a:r.a, ri:i}); });
  for (const key in PD.dongs){
    const ri = +key;
    PD.dongs[key].forEach((d,di)=>{
      if (dngs.length < 4 && d.toLowerCase().includes(k) && d !== k)
        dngs.push({t:"d", n:d, ri, di});
    });
  }
  for (let i=0;i<CXFLAT.length && cxs.length<9;i++){
    const c = CXFLAT[i];
    if (c.n.toLowerCase().includes(k)) cxs.push({t:"c", n:c.n, ri:c.ri, di:c.di, hh:c.hh});
  }
  return regs.slice(0,4).concat(dngs).concat(cxs);
}
function renderResults(){
  if(!results.length){
    slEl.innerHTML = '<div class="sempty">일치하는 지역·단지가 없습니다.</div>';
  } else {
    slEl.innerHTML = results.map((it,i)=>{
      const r = PD.regions[it.ri];
      let badge, sub;
      if (it.t === "r"){ badge = "지역"; sub = it.a + " · 지역 대시보드로 이동"; }
      else if (it.t === "d"){
        badge = "동";
        const n = cxOf(it.ri, it.di).length;
        sub = r.a + " · " + r.n + " · 단지 " + n + "곳";
      } else {
        badge = "단지";
        sub = r.n + " " + esc(dongsOf(it.ri)[it.di] || "") + " · " + (it.hh ? Number(it.hh).toLocaleString()+"세대" : "세대 미상");
      }
      return `<div class="sitem${i===cur?" cur":""}" data-i="${i}" role="option">`
        + `<span class="bd${it.t==="r"?" rg":""}${it.t==="d"?" dg":""}">${badge}</span>`
        + `<span class="tx"><b>${esc(it.n)}</b><i>${sub}</i></span>`
        + `<span class="go">↗</span></div>`;
    }).join("");
  }
  sdEl.classList.add("on");
}
function pick(i){
  const it = results[i];
  if(!it) return;
  const rn = PD.regions[it.ri].n;
  if (it.t === "r"){
    location.href = PAGES["01"] + "?v=" + BUILD + "#region=" + encodeURIComponent(it.n);
  } else if (it.t === "d"){
    location.href = PAGES["01"] + "?v=" + BUILD + "#region=" + encodeURIComponent(rn)
      + "&dong=" + encodeURIComponent(it.n);
  } else {
    const dn = dongsOf(it.ri)[it.di] || "";
    location.href = PAGES["04"] + "?v=" + BUILD + "#ind=29&region=" + encodeURIComponent(rn)
      + "&dong=" + encodeURIComponent(dn) + "&q=" + encodeURIComponent(it.n);
  }
}
function closeDrop(){ sdEl.classList.remove("on"); cur = -1; }

qEl.addEventListener("input", ()=>{
  const v = qEl.value;
  clrEl.classList.toggle("on", v.length>0);
  results = find(v); cur = -1;
  if(v.trim()) renderResults(); else closeDrop();
});
qEl.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowDown" || e.key==="ArrowUp"){
    if(!results.length) return;
    e.preventDefault();
    cur = (cur + (e.key==="ArrowDown" ? 1 : -1) + results.length) % results.length;
    renderResults();
    const box = slEl.querySelector(".cur"); if(box) box.scrollIntoView({block:"nearest"});
  } else if(e.key==="Enter"){
    if(sdEl.classList.contains("on") && results.length) { e.preventDefault(); pick(cur>=0?cur:0); }
  } else if(e.key==="Escape"){ closeDrop(); qEl.blur(); }
});
clrEl.addEventListener("click", ()=>{ qEl.value=""; results=[]; clrEl.classList.remove("on"); closeDrop(); qEl.focus(); });
slEl.addEventListener("click", (e)=>{
  const it = e.target.closest(".sitem"); if(!it) return;
  pick(+it.dataset.i);
});
document.addEventListener("click", (e)=>{
  if(!e.target.closest(".sbox")) closeDrop();
});
</script>
</body>
</html>
