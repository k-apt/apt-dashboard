*{box-sizing:border-box}

table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:auto}

tbody tr{cursor:pointer}

.tablebar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}

.warn{background:#fff8e6;border:1px solid #f2e0b3;color:#8a6b1f;border-radius:9px;

function renderKPI(ind, r, reg){
  const v = REG[ind.no].v[STATE.r];
  const arr = REG[ind.no].v;
  const nums = arr.map((x,i)=>[x,i]).filter(([x])=>typeof x==="number");
  const sorted = [...nums].sort((a,b)=>b[0]-a[0]);
  const rank = nums.length ? sorted.findIndex(([x,i])=>i===STATE.r)+1 : 0;
  const med = nums.length ? [...nums].sort((a,b)=>a[0]-b[0])[Math.floor(nums.length/2)][0] : null;
  const aux = REG[ind.no].aux||{};
  const gradeKey = Object.keys(aux).find(k=>["우선도","등급","신호","판정","사분면","유형","국면"].includes(k))
                 || Object.keys(aux).find(k=>aux[k].every(x=>typeof x==="string"));
  const grade = gradeKey ? aux[gradeKey][STATE.r] : null;
  const pct = nums.length && rank ? Math.round((1-rank/nums.length)*100) : 0;

    <div class="kpi"><div class="k">${r.n} · ${r.a}</div>

      <div class="d">${rank?`상위 ${pct}% · ${nums.length}개 지역`:ind.level+" 단위 분류값"}</div>
      <div class="rankbar"><i style="width:${pct}%"></i></div></div>

function svgEl(tag,attrs={}){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); return e;}

function renderChart(ind, r, reg){
  const box = $("#chart"); box.innerHTML="";
  if(ind.no===3) return chartScatter(ind,box);
  if(ind.no===47 && DET[ind.no]) return chartLine(ind,box);
  return chartBars(ind,box);

function niceTicks(min,max,n=5){
  if(min===max){min-=1;max+=1;}
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag, step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const t=[]; for(let x=lo;x<=hi+1e-9;x+=step) t.push(+x.toFixed(6));
  return {ticks:t,lo,hi};
}

function chartBars(ind,box){
  const vals = REG[ind.no].v;
  const rows = vals.map((v,i)=>({v,i})).filter(o=>typeof o.v==="number");
  const sel = rows.find(o=>o.i===STATE.r);
  const sorted = rows.slice().sort((a,b)=>b.v-a.v);
  const top = sorted.slice(0,12), bot = sorted.slice(-12);
  let show = top.concat(bot);
  const hasBoth = top.length>0 && bot.length>0 && top[top.length-1].v!==bot[0].v;
  if(sel && !show.find(o=>o.i===sel.i)) show=show.concat([sel]);
  show = show.filter((o,k,a)=>a.findIndex(x=>x.i===o.i)===k).sort((a,b)=>b.v-a.v);
  const W=980, rowH=24, H=show.length*rowH+70, padL=118, padR=88, padT=14;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"xMidYMid meet"});
  const vmin=Math.min(0,...show.map(o=>o.v)), vmax=Math.max(0,...show.map(o=>o.v));
  const {ticks,lo,hi}=niceTicks(vmin,vmax,5);
  const X=v=>padL+(v-lo)/(hi-lo)*(W-padL-padR);
  ticks.forEach(t=>{
    svg.appendChild(svgEl("line",{x1:X(t),x2:X(t),y1:padT,y2:H-34,stroke:"#eef1f5","stroke-width":1}));
    const tx=svgEl("text",{x:X(t),y:H-18,"text-anchor":"middle","font-size":10,fill:"#8b93a1"});
    tx.textContent=(Math.abs(t)>=1000?Math.round(t).toLocaleString():t.toFixed(Math.abs(t)<10?2:0));
    svg.appendChild(tx);
  });
  let gapAt=-1;
  if(hasBoth){
    const lastTop = top[top.length-1].i;
    gapAt = show.findIndex(o=>o.i===lastTop)+1;
  }
  show.forEach((o,k)=>{
    const y=padT+k*rowH+(k>=gapAt&&gapAt>0?10:0), h=rowH*0.62;
    const name=REGIONS[o.i].n, col=COLORS[REGIONS[o.i].a]||"#888";
    const b=svgEl("rect",{x:Math.min(X(0),X(o.v)),y:y,width:Math.max(1.5,Math.abs(X(o.v)-X(0))),height:h,
      fill:col,rx:2,opacity:(sel&&o.i===STATE.r)?1:0.82,cursor:"pointer"});
    if(sel&&o.i===STATE.r){b.setAttribute("stroke","#111");b.setAttribute("stroke-width","2");}
    b.addEventListener("click",()=>{STATE.r=o.i;$("#regionSel").value=o.i;render();});
    b.appendChild(svgEl("title")).textContent=`${name} ${fmtN(o.v,ind.unit)}`;
    svg.appendChild(b);
    const t=svgEl("text",{x:padL-8,y:y+h/2+4,"text-anchor":"end","font-size":11,fill:"#4a5464"});
    t.textContent=name; svg.appendChild(t);
    const vt=svgEl("text",{x:X(o.v)+(o.v>=0?6:-6),y:y+h/2+4,"text-anchor":o.v>=0?"start":"end",
      "font-size":10.5,fill:"#1b2230","font-weight":(sel&&o.i===STATE.r)?700:400});
    vt.textContent=fmtN(o.v,ind.unit,SIGNED.test(ind.value_col)).replace(/^\+/,""); svg.appendChild(vt);
  });
  if(gapAt>0){
    const y=padT+gapAt*rowH+4;
    svg.appendChild(svgEl("line",{x1:padL-104,x2:W-padR,y1:y,y2:y,stroke:"#d5dbe5","stroke-dasharray":"4 4"}));
    const t=svgEl("text",{x:padL-104,y:y-4,"font-size":9.5,fill:"#9aa1ad"});
    t.textContent="— 상위 12 · 하위 12개 지역 (축 연속) —"; svg.appendChild(t);
  }
  svg.setAttribute("height",H+(gapAt>0?10:0));
  box.appendChild(svg);
}

function chartLine(ind,box){
  const d=DET[ind.no], ci=d.cols.indexOf("지역"), cols=d.cols.map((c,k)=>[c,k]).filter(([c])=>c.startsWith("y"));
  const yr=cols.map(([c])=>c.slice(1));
  const row=d.rows.find(r=>r[ci]===curReg().n);
  const W=980,H=400,padL=64,padR=24,padT=20,padB=40;
  const vals=cols.map(([c,k])=>row?row[k]:null);
  const all=d.rows.map(r=>cols.map(([c,k])=>r[k])).flat().filter(v=>typeof v==="number");
  const ymax=Math.max(...all,1);
  const X=i=>padL+i/(yr.length-1)*(W-padL-padR), Y=v=>H-padB-(v/ymax)*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  [0,.25,.5,.75,1].forEach(f=>{
    const v=ymax*f;
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(v),y2:Y(v),stroke:"#eef1f5"}));
    const t=svgEl("text",{x:padL-8,y:Y(v)+4,"text-anchor":"end","font-size":10,fill:"#8b93a1"});
    t.textContent=Math.round(v).toLocaleString(); svg.appendChild(t);
  });
  const med=yr.map((_,i)=>{const a=d.rows.map(r=>r[cols[i][1]]).filter(v=>typeof v==="number").sort((a,b)=>a-b);
    return a.length?a[Math.floor(a.length/2)]:0;});
  svg.appendChild(svgEl("polyline",{points:med.map((v,i)=>`${X(i)},${Y(v)}`).join(" "),
    fill:"none",stroke:"#9aa1ad","stroke-width":1.6,"stroke-dasharray":"5 4"}));
  if(row){
    svg.appendChild(svgEl("polyline",{points:vals.map((v,i)=>`${X(i)},${Y(v||0)}`).join(" "),
      fill:"none",stroke:"#2f6fd0","stroke-width":2.6}));

      c.appendChild(svgEl("title")).textContent=`${yr[i]}년 ${Math.round(v||0).toLocaleString()}호`;
      svg.appendChild(c);});
  }
  yr.forEach((y,i)=>{const t=svgEl("text",{x:X(i),y:H-14,"text-anchor":"middle","font-size":10,fill:"#8b93a1"});
    t.textContent="'"+y.slice(2); svg.appendChild(t);});
  box.appendChild(svg);
}

function currentTable(){
  const ind=curInd();
  if(STATE.view==="reg"){
    const aux=REG[ind.no].aux||{};
    const cols=[{k:"지역",t:"지역",txt:true},{k:"권역",t:"권역",txt:true},
      {k:"값",t:`${ind.value_col} (${ind.unit||"-"})`,txt:typeof REG[ind.no].v.find(x=>x!==null)==="string"},
      ...Object.keys(aux).map(k=>({k,t:k,txt:!(aux[k].some(x=>typeof x==="number"))}))];
    let rows=REGIONS.map((r,i)=>({i,지역:r.n,권역:r.a,값:REG[ind.no].v[i],
      ...Object.fromEntries(Object.keys(aux).map(k=>[k,aux[k][i]]))}));
    if(STATE.q){const q=STATE.q; rows=rows.filter(r=>r.지역.includes(q));}
    if(STATE.sort.col){
      const c=STATE.sort.col, d=STATE.sort.dir;
      rows.sort((a,b)=>{const x=a[c],y=b[c];
        if(typeof x==="number"&&typeof y==="number") return (x-y)*d;
        return String(x).localeCompare(String(y))*d;});
    } else rows.sort((a,b)=>(typeof b.값==="number"?b.값:-1e9)-(typeof a.값==="number"?a.값:-1e9));
    return {cols,rows,ind};
  }
  const d=DET[ind.no];
  if(!d) return {cols:[],rows:[],ind};
  const cols=d.cols.map((c,k)=>({k,t:c,txt:!["전용면적","세대수",ind.value_col].includes(c)}));
  let rows=d.rows.map((r,k)=>Object.fromEntries(d.cols.map((c,j)=>[c,r[j]])));
  if(STATE.q){const q=STATE.q; rows=rows.filter(r=>Object.values(r).some(v=>typeof v==="string"&&v.includes(q)));}
  const vc=ind.value_col;
  if(STATE.sort.col){
    const c=STATE.sort.col,d=STATE.sort.dir;
    rows.sort((a,b)=>{const x=a[c],y=b[c];
      if(typeof x==="number"&&typeof y==="number") return (x-y)*d;
      return String(x).localeCompare(String(y))*d;});
  } else if(d.cols.includes(vc)) rows.sort((a,b)=>(b[vc]??-1e9)-(a[vc]??-1e9));
  return {cols,rows,ind};
}

    if(STATE.sort.col===c.k){th.classList.add("sorted"); if(STATE.sort.dir===1)th.classList.add("asc");}
    th.onclick=()=>{
      if(STATE.sort.col===c.k) STATE.sort.dir*=-1; else {STATE.sort.col=c.k;STATE.sort.dir=-1;}
      STATE.page=0; renderTable();
    };
    tr.appendChild(th);
  });
  head.appendChild(tr);
  const total=rows.length, pages=Math.max(1,Math.ceil(total/PAGE));
  STATE.page=Math.min(STATE.page,pages-1);
  const start=STATE.page*PAGE, slice=rows.slice(start,start+PAGE);
  const body=$("#tbl tbody"); body.innerHTML="";
  slice.forEach(row=>{
    const tr=el("tr");
    if(STATE.view==="reg" && row.i===STATE.r) tr.classList.add("sel");
    cols.forEach(c=>{
      const td=el("td",c.txt?"txt":"");
      const v=row[c.k];
      td.textContent = (c.k==="값"||c.k===ind.value_col)?fmtN(v,ind.unit,SIGNED.test(c.t)||SIGNED.test(ind.value_col)):
        (typeof v==="number"?(Math.abs(v)>=100?Math.round(v).toLocaleString():v.toFixed(2)):(v||"—"));
      tr.appendChild(td);
    });
    if(STATE.view==="reg"){tr.onclick=()=>{STATE.r=row.i;$("#regionSel").value=row.i;render();};}
    body.appendChild(tr);
  });
  $("#pager").innerHTML = `<span>${start+1}-${Math.min(start+PAGE,total)} / ${total.toLocaleString()}행</span>
    <button ${STATE.page<=0?"disabled":""} id="pgPrev">◀</button>
    <button ${STATE.page>=pages-1?"disabled":""} id="pgNext">▶</button>`;
  const p1=$("#pgPrev"), p2=$("#pgNext");
  if(p1) p1.onclick=()=>{STATE.page--;renderTable();};
  if(p2) p2.onclick=()=>{STATE.page++;renderTable();};
  window.__rows = rows; window.__cols = cols;
}

function download(name, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
}
function saveCSV(){
  const {cols,rows}=currentTable(); const ind=curInd();
  const head=cols.map(c=>`"${c.t}"`).join(",");
  const lines=rows.map(r=>cols.map(c=>{const v=r[c.k]; return typeof v==="string"?`"${v.replace(/"/g,'""')}"`:(v===null||v===undefined?"":v);}).join(","));
  download(`ind${String(ind.no).padStart(2,"0")}_${curReg().n}.csv`,
    new Blob(["\ufeff"+[head,...lines].join("\n")],{type:"text/csv;charset=utf-8"}));
}
function savePNG(){
  const svg=$("#chart").querySelector("svg"); if(!svg) return;
  const ind=curInd(), r=curReg();
  const vb=svg.getAttribute("viewBox").split(" ").map(Number), W=vb[2], H=vb[3], S=2;
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width",W); clone.setAttribute("height",H);
  const bg=document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("width",W); bg.setAttribute("height",H); bg.setAttribute("fill","#ffffff");
  clone.insertBefore(bg,clone.firstChild);
  const head=document.createElementNS("http://www.w3.org/2000/svg","text");
  head.setAttribute("x",16); head.setAttribute("y",H-6); head.setAttribute("font-size",11);
  head.setAttribute("fill","#8b93a1");
  head.textContent=`#${ind.no} ${ind.name} · ${r.n} · 기준일 ${M.date} · 지표 50선`;
  clone.appendChild(head);
  const xml=new XMLSerializer().serializeToString(clone);
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement("canvas"); cv.width=W*S; cv.height=H*S;
    const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>download(`ind${String(ind.no).padStart(2,"0")}_${r.n}.png`,b),"image/png");
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);
}
init();
</script>
