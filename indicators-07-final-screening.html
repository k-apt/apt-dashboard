<style>
:root{

  --soft:#eef2f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);

  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1560px;margin:0 auto;padding:22px 26px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap}
.catno{display:inline-block;font-size:12px;letter-spacing:.14em;color:var(--sub);font-weight:700}
h1{margin:4px 0 4px;font-size:25px;letter-spacing:-.02em}
.summary{color:var(--sub);font-size:13.5px;max-width:900px}
.meta{font-size:11.5px;color:#8b93a1;text-align:right;line-height:1.7;white-space:nowrap}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px 22px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.guide div{font-size:12.5px;color:#4a5464;position:relative;padding-left:14px}
.guide div:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:#c3ccdb}

.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.region-picker{position:relative}
select,input[type=text]{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:8px 12px;outline:none}
select:focus,input:focus{border-color:#9fb4d4;box-shadow:0 0 0 3px #e7eefb}
select{min-width:230px;font-weight:600}
.nav-btns{display:flex;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 12px;transition:.12s}
button:hover{background:#f2f5fa}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.12)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#4a5464}
.tab.on{background:#1b2230;color:#fff;border-color:#1b2230;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
@media(max-width:1180px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-size:14px;margin:0 0 2px;letter-spacing:-.01em}
.card .sub{font-size:11.5px;color:var(--sub);margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:11px;color:var(--sub);letter-spacing:.02em}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.kpi .d{font-size:11px;color:#8b93a1;margin-top:2px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.chart-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:auto}
td,th{white-space:nowrap;font-variant-numeric:tabular-nums}
td.txt,th.txt{width:1%}
th,td{padding:7px 9px;border-bottom:1px solid #eef1f5;text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#fff;color:#5a6270;font-weight:700;font-size:11.5px;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--line);z-index:2}
th:hover{color:#1b2230}
th.sorted:after{content:" ▾";font-size:9px}
th.sorted.asc:after{content:" ▴"}
td.txt,th.txt{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f7f9fc}
tbody tr.sel{background:#eaf1fd}
tbody tr.sel td{font-weight:700}
.tablewrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tablebar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tablebar input[type=text]{min-width:220px}
.pager{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:12px;color:var(--sub)}
.note{font-size:11.5px;color:#8b93a1;margin-top:10px;line-height:1.6}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:#3f4a5c}
.rankbar{height:6px;background:#eef1f5;border-radius:3px;overflow:hidden;margin-top:6px}
.rankbar i{display:block;height:100%;background:var(--seoul)}
.tip{position:fixed;pointer-events:none;background:#1b2230;color:#fff;font-size:11.5px;
  padding:5px 8px;border-radius:6px;opacity:0;transition:opacity .08s;z-index:99}
.foot{margin-top:22px;font-size:11.5px;color:#8b93a1;border-top:1px solid var(--line);padding-top:12px}
.warn{background:#fff8e6;border:1px solid #f2e0b3;color:#8a6b1f;border-radius:9px;
  padding:8px 12px;font-size:12px;margin-bottom:12px}
</style>
</head>

const indMeta = no => INDS.find(i=>i.no===no);
const curInd = ()=>indMeta(STATE.ind);
const curReg = ()=>REGIONS[STATE.r];

function init(){
  $("#catno").textContent = "CATEGORY "+M.cat;
  $("#title").textContent = M.title;
  $("#summary").textContent = M.summary;
  $("#meta").innerHTML = "기준일 "+M.date+" · 83개 지역<br>빌드 "+M.built+" · 오프라인 단일 파일";
  $("#guide").innerHTML = M.guide.map(g=>`<div>${g}</div>`).join("");
  const sel = $("#regionSel");
  const groups = {};
  REGIONS.forEach((r,i)=>{(groups[r.a]=groups[r.a]||[]).push([i,r]);});
  Object.keys(groups).forEach(g=>{
    const og = el("optgroup"); og.label=g;
    groups[g].forEach(([i,r])=>{const o=el("option",null,r.n); o.value=i; og.appendChild(o);});
    sel.appendChild(og);
  });
  sel.value = STATE.r;
  sel.onchange = ()=>{STATE.r=+sel.value; STATE.page=0; render();};
  $("#prev").onclick = ()=>step(-1);
  $("#next").onclick = ()=>step(1);
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
    if(e.key==="ArrowLeft") step(-1);
    if(e.key==="ArrowRight") step(1);
  });
  $("#tabs").innerHTML="";
  INDS.forEach(i=>{
    const b = el("button","tab"+(i.no===STATE.ind?" on":""),`#${i.no} ${i.name}`);
    b.onclick=()=>{STATE.ind=i.no; STATE.page=0; STATE.sort={col:null,dir:-1}; render();};
    $("#tabs").appendChild(b);
  });
  $("#q").oninput = e=>{STATE.q=e.target.value.trim(); STATE.page=0; renderTable();};
  $("#tabReg").onclick=()=>{STATE.view="reg"; STATE.page=0; renderTable();};
  $("#tabDet").onclick=()=>{STATE.view="det"; STATE.page=0; renderTable();};
  $("#pngBtn").onclick=savePNG;
  $("#csvBtn").onclick=saveCSV;
  render();
  window.APP = {state:STATE, render, renderTable, setRegion:(n)=>{const i=REGIONS.findIndex(x=>x.n===n);
    if(i>=0){STATE.r=i;$("#regionSel").value=i;render();}} , setInd:(n)=>{STATE.ind=n;render();}};
}
function step(d){
  STATE.r = (STATE.r + d + REGIONS.length) % REGIONS.length;
  $("#regionSel").value = STATE.r; STATE.page=0; render();
}

function render(){
  const ind = curInd(), r = curReg(), reg = REG[ind.no];
  document.querySelectorAll("#tabs .tab").forEach((b,i)=>b.classList.toggle("on",INDS[i].no===ind.no));
  $("#chartTitle").textContent = `#${ind.no} ${ind.name} · 지역 순위 (${ind.unit||"-"})`;
  $("#chartSub").textContent = ind.method;
  $("#defbox").innerHTML = `
    <div style="margin-bottom:8px"><span class="tag">산식</span> ${ind.method}</div>
    <div style="margin-bottom:8px"><span class="tag">기준</span> ${ind.criteria||"—"}</div>
    <div style="margin-bottom:8px"><span class="tag">해석</span> ${ind.read||"—"}</div>
    <div style="margin-bottom:8px"><span class="tag">원천</span> ${ind.src} · 조인 ${ind.join}</div>
    <div><span class="tag">커버리지</span> ${ind.coverage}</div>`;
  renderKPI(ind, r, reg);
  renderChart(ind, r, reg);
  renderTable();
  $("#foot").innerHTML = `지표 50선 · 7개 카테고리 · ${M.title} · 기준일 ${M.date}<br>
    산출 원천: 네이버 호가·국토부 실거래(24~26)·물리스펙 DB·입지 메타·외지인/역전세·3040 순이동·공급/이주·정비사업·경매·청약/미분양·토허제.
    단지 상세는 세대수 상위 ${DET[ind.no]?DET[ind.no].rows.length.toLocaleString():"0"}건까지 내장(전체 상세는 CLI 스크립트 사용).`;
}

function seriesOf(no){ return REG[no].v; }
function rankOf(no){
  const v = seriesOf(no).filter(x=>typeof x==="number");
  return v.sort((a,b)=>b-a);
}
function renderKPI(ind, r, reg){
  const v = REG[ind.no].v[STATE.r];
  const arr = REG[ind.no].v;
  const nums = arr.map((x,i)=>[x,i]).filter(([x])=>typeof x==="number");
  const sorted = [...nums].sort((a,b)=>b[0]-a[0]);
  const rank = nums.length ? sorted.findIndex(([x,i])=>i===STATE.r)+1 : 0;
  const med = nums.length ? [...nums].sort((a,b)=>a[0]-b[0])[Math.floor(nums.length/2)][0] : null;
  const aux = REG[ind.no].aux||{};
  const gradeKey = Object.keys(aux).find(k=>["우선도","등급","신호","판정","사분면","유형","국면"].includes(k))
                 || Object.keys(aux).find(k=>aux[k].every(x=>typeof x==="string"));
  const grade = gradeKey ? aux[gradeKey][STATE.r] : null;
  const pct = nums.length && rank ? Math.round((1-rank/nums.length)*100) : 0;
  $("#kpis").innerHTML = `
    <div class="kpi"><div class="k">${r.n} · ${r.a}</div>
      <div class="v">${fmtN(v,ind.unit,SIGNED.test(ind.value_col))}</div>
      <div class="d">${ind.value_col}</div></div>
    <div class="kpi"><div class="k">판정</div><div class="v" style="font-size:17px">${grade||"—"}</div>
      <div class="d">${ind.criteria?ind.criteria.split("·")[0]:"—"}</div></div>
    <div class="kpi"><div class="k">순위</div><div class="v">${rank?rank+"위":"분류 지표"}</div>
      <div class="d">${rank?`상위 ${pct}% · ${nums.length}개 지역`:ind.level+" 단위 분류값"}</div>
      <div class="rankbar"><i style="width:${pct}%"></i></div></div>
    <div class="kpi"><div class="k">83개 지역 중위</div><div class="v">${fmtN(med,ind.unit)}</div>
      <div class="d">${ind.level}</div></div>`;
}

function svgEl(tag,attrs={}){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); return e;}

function renderChart(ind, r, reg){
  const box = $("#chart"); box.innerHTML="";
  if(ind.no===3) return chartScatter(ind,box);
  if(ind.no===47 && DET[ind.no]) return chartLine(ind,box);
  return chartBars(ind,box);
}

function niceTicks(min,max,n=5){
  if(min===max){min-=1;max+=1;}
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag, step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step;
  const t=[]; for(let x=lo;x<=hi+1e-9;x+=step) t.push(+x.toFixed(6));
  return {ticks:t,lo,hi};
}

function chartBars(ind,box){
  const vals = REG[ind.no].v;
  const rows = vals.map((v,i)=>({v,i})).filter(o=>typeof o.v==="number");
  const sel = rows.find(o=>o.i===STATE.r);
  const sorted = rows.slice().sort((a,b)=>b.v-a.v);
  const top = sorted.slice(0,12), bot = sorted.slice(-12);
  let show = top.concat(bot);
  const hasBoth = top.length>0 && bot.length>0 && top[top.length-1].v!==bot[0].v;
  if(sel && !show.find(o=>o.i===sel.i)) show=show.concat([sel]);
  show = show.filter((o,k,a)=>a.findIndex(x=>x.i===o.i)===k).sort((a,b)=>b.v-a.v);
  const W=980, rowH=24, H=show.length*rowH+70, padL=118, padR=88, padT=14;
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"xMidYMid meet"});
  const vmin=Math.min(0,...show.map(o=>o.v)), vmax=Math.max(0,...show.map(o=>o.v));
  const {ticks,lo,hi}=niceTicks(vmin,vmax,5);
  const X=v=>padL+(v-lo)/(hi-lo)*(W-padL-padR);
  ticks.forEach(t=>{
    svg.appendChild(svgEl("line",{x1:X(t),x2:X(t),y1:padT,y2:H-34,stroke:"#eef1f5","stroke-width":1}));
    const tx=svgEl("text",{x:X(t),y:H-18,"text-anchor":"middle","font-size":10,fill:"#8b93a1"});
    tx.textContent=(Math.abs(t)>=1000?Math.round(t).toLocaleString():t.toFixed(Math.abs(t)<10?2:0));
    svg.appendChild(tx);
  });
  let gapAt=-1;
  if(hasBoth){
    const lastTop = top[top.length-1].i;
    gapAt = show.findIndex(o=>o.i===lastTop)+1;
  }
  show.forEach((o,k)=>{
    const y=padT+k*rowH+(k>=gapAt&&gapAt>0?10:0), h=rowH*0.62;
    const name=REGIONS[o.i].n, col=COLORS[REGIONS[o.i].a]||"#888";
    const b=svgEl("rect",{x:Math.min(X(0),X(o.v)),y:y,width:Math.max(1.5,Math.abs(X(o.v)-X(0))),height:h,
      fill:col,rx:2,opacity:(sel&&o.i===STATE.r)?1:0.82,cursor:"pointer"});
    if(sel&&o.i===STATE.r){b.setAttribute("stroke","#111");b.setAttribute("stroke-width","2");}
    b.addEventListener("click",()=>{STATE.r=o.i;$("#regionSel").value=o.i;render();});
    b.appendChild(svgEl("title")).textContent=`${name} ${fmtN(o.v,ind.unit)}`;
    svg.appendChild(b);
    const t=svgEl("text",{x:padL-8,y:y+h/2+4,"text-anchor":"end","font-size":11,fill:"#4a5464"});
    t.textContent=name; svg.appendChild(t);
    const vt=svgEl("text",{x:X(o.v)+(o.v>=0?6:-6),y:y+h/2+4,"text-anchor":o.v>=0?"start":"end",
      "font-size":10.5,fill:"#1b2230","font-weight":(sel&&o.i===STATE.r)?700:400});
    vt.textContent=fmtN(o.v,ind.unit,SIGNED.test(ind.value_col)).replace(/^\+/,""); svg.appendChild(vt);
  });
  if(gapAt>0){
    const y=padT+gapAt*rowH+4;
    svg.appendChild(svgEl("line",{x1:padL-104,x2:W-padR,y1:y,y2:y,stroke:"#d5dbe5","stroke-dasharray":"4 4"}));
    const t=svgEl("text",{x:padL-104,y:y-4,"font-size":9.5,fill:"#9aa1ad"});
    t.textContent="— 상위 12 · 하위 12개 지역 (축 연속) —"; svg.appendChild(t);
  }
  svg.setAttribute("height",H+(gapAt>0?10:0));
  box.appendChild(svg);
}

function chartScatter(ind,box){
  const xs=REG[ind.no].aux, W=980,H=520,padL=70,padR=34,padT=22,padB=52;
  const numKeys=Object.keys(xs).filter(k=>xs[k].some(x=>typeof x==="number"));
  const xk=Object.keys(xs).find(k=>k.includes("공급배율"))||numKeys[0];
  const yk=Object.keys(xs).find(k=>k.includes("순이동"))||numKeys.find(k=>k!==xk)||numKeys[1];
  const xv=xs[xk], yv=xs[yk];
  const pts=REGIONS.map((r,i)=>({i,x:xv[i],y:yv[i]})).filter(p=>typeof p.x==="number"&&typeof p.y==="number");
  const q=(arr,f)=>{const a=arr.slice().sort((p,q)=>p-q); return a[Math.min(a.length-1,Math.max(0,Math.floor(f*(a.length-1))))];};
  const xmin=0, xmax=Math.max(1.2,q(pts.map(p=>p.x),0.97));
  const ymin=Math.min(-30,q(pts.map(p=>p.y),0.02)), ymax=Math.max(12,q(pts.map(p=>p.y),0.98));
  const cx=v=>Math.min(Math.max(v,xmin),xmax), cy=v=>Math.min(Math.max(v,ymin),ymax);
  const X=v=>padL+(cx(v)-xmin)/(xmax-xmin)*(W-padL-padR);
  const Y=v=>H-padB-(cy(v)-ymin)/(ymax-ymin)*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"xMidYMid meet"});
  // 사분면 배경
  svg.appendChild(svgEl("rect",{x:X(0),y:Y(ymax),width:X(1)-X(0),height:Y(0)-Y(ymax),fill:"#f2f8f4",opacity:.7}));
  svg.appendChild(svgEl("rect",{x:X(1),y:Y(0),width:W-padR-X(1),height:Y(ymin)-Y(0),fill:"#fdf3f2",opacity:.7}));
  // 축 눈금
  const nx=5;
  for(let k=0;k<=nx;k++){
    const v=xmin+(xmax-xmin)*k/nx;
    svg.appendChild(svgEl("line",{x1:X(v),x2:X(v),y1:padT,y2:H-padB,stroke:"#eef1f5"}));
    const t=svgEl("text",{x:X(v),y:H-padB+16,"text-anchor":"middle","font-size":10,fill:"#8b93a1"});
    t.textContent=v.toFixed(1)+"x"; svg.appendChild(t);
  }
  const ny=5;
  for(let k=0;k<=ny;k++){
    const v=ymin+(ymax-ymin)*k/ny;
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(v),y2:Y(v),stroke:"#eef1f5"}));
    const t=svgEl("text",{x:padL-8,y:Y(v)+4,"text-anchor":"end","font-size":10,fill:"#8b93a1"});
    t.textContent=(v>0?"+":"")+v.toFixed(0)+"%"; svg.appendChild(t);
  }
  svg.appendChild(svgEl("line",{x1:X(1),x2:X(1),y1:padT,y2:H-padB,stroke:"#8d97a8","stroke-dasharray":"4 4"}));
  svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(0),y2:Y(0),stroke:"#8d97a8","stroke-dasharray":"4 4"}));
  [[padL+8,padT+16,"공급과소·유입 (최우선)","start"],[W-padR-8,padT+16,"공급과잉·유입","end"],
   [padL+8,H-padB-8,"공급과소·유출","start"],[W-padR-8,H-padB-8,"공급과잉·유출 (회피)","end"]].forEach(([x,y,t,a])=>{
    const tx=svgEl("text",{x,y,"text-anchor":a,"font-size":10,fill:"#9aa1ad"}); tx.textContent=t; svg.appendChild(tx);});
  pts.forEach(p=>{
    const c=svgEl("circle",{cx:X(p.x),cy:Y(p.y),r:(p.i===STATE.r?9:5),fill:COLORS[REGIONS[p.i].a],
      opacity:p.i===STATE.r?1:.78,stroke:p.i===STATE.r?"#111":"#fff","stroke-width":p.i===STATE.r?2:1,cursor:"pointer"});
    c.appendChild(svgEl("title")).textContent=`${REGIONS[p.i].n} (공급배율 ${p.x.toFixed(2)}, 순이동 ${p.y.toFixed(1)}%)`;
    c.addEventListener("click",()=>{STATE.r=p.i;$("#regionSel").value=p.i;render();});
    svg.appendChild(c);
    if(p.i===STATE.r){
      const t=svgEl("text",{x:X(p.x)+12,y:Y(p.y)-8,"font-size":11,"font-weight":700,fill:"#1b2230"});
      t.textContent=REGIONS[p.i].n; svg.appendChild(t);
    }
  });
  const xt=svgEl("text",{x:(padL+W-padR)/2,y:H-14,"text-anchor":"middle","font-size":10.5,fill:"#66707f"});
  xt.textContent="3년 공급배율 (2027~2029 공급 ÷ 적정수요)"; svg.appendChild(xt);
  const yt=svgEl("text",{x:16,y:H/2,transform:`rotate(-90 16 ${H/2})`,"text-anchor":"middle","font-size":10.5,fill:"#66707f"});
  yt.textContent="30~40대 5년 순이동률 (%)"; svg.appendChild(yt);
  const note=svgEl("text",{x:W-padR,y:H-4,"text-anchor":"end","font-size":9,fill:"#a8b0bd"});
  note.textContent=`축 범위: x 0~${xmax.toFixed(1)}x · y ${ymin.toFixed(0)}~${ymax.toFixed(0)}% (범위 밖 값은 가장자리에 표시)`;
  svg.appendChild(note);
  box.appendChild(svg);
}

function chartLine(ind,box){
  const d=DET[ind.no], ci=d.cols.indexOf("지역"), cols=d.cols.map((c,k)=>[c,k]).filter(([c])=>c.startsWith("y"));
  const yr=cols.map(([c])=>c.slice(1));
  const row=d.rows.find(r=>r[ci]===curReg().n);
  const W=980,H=400,padL=64,padR=24,padT=20,padB=40;
  const vals=cols.map(([c,k])=>row?row[k]:null);
  const all=d.rows.map(r=>cols.map(([c,k])=>r[k])).flat().filter(v=>typeof v==="number");
  const ymax=Math.max(...all,1);
  const X=i=>padL+i/(yr.length-1)*(W-padL-padR), Y=v=>H-padB-(v/ymax)*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  [0,.25,.5,.75,1].forEach(f=>{
    const v=ymax*f;
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(v),y2:Y(v),stroke:"#eef1f5"}));
    const t=svgEl("text",{x:padL-8,y:Y(v)+4,"text-anchor":"end","font-size":10,fill:"#8b93a1"});
    t.textContent=Math.round(v).toLocaleString(); svg.appendChild(t);
  });
  const med=yr.map((_,i)=>{const a=d.rows.map(r=>r[cols[i][1]]).filter(v=>typeof v==="number").sort((a,b)=>a-b);
    return a.length?a[Math.floor(a.length/2)]:0;});
  svg.appendChild(svgEl("polyline",{points:med.map((v,i)=>`${X(i)},${Y(v)}`).join(" "),
    fill:"none",stroke:"#9aa1ad","stroke-width":1.6,"stroke-dasharray":"5 4"}));
  if(row){
    svg.appendChild(svgEl("polyline",{points:vals.map((v,i)=>`${X(i)},${Y(v||0)}`).join(" "),
      fill:"none",stroke:"#2f6fd0","stroke-width":2.6}));
    vals.forEach((v,i)=>{const c=svgEl("circle",{cx:X(i),cy:Y(v||0),r:3.6,fill:"#2f6fd0"});
      c.appendChild(svgEl("title")).textContent=`${yr[i]}년 ${Math.round(v||0).toLocaleString()}호`;
      svg.appendChild(c);});
  }
  yr.forEach((y,i)=>{const t=svgEl("text",{x:X(i),y:H-14,"text-anchor":"middle","font-size":10,fill:"#8b93a1"});
    t.textContent="'"+y.slice(2); svg.appendChild(t);});
  box.appendChild(svg);
}

function currentTable(){
  const ind=curInd();
  if(STATE.view==="reg"){
    const aux=REG[ind.no].aux||{};
    const cols=[{k:"지역",t:"지역",txt:true},{k:"권역",t:"권역",txt:true},
      {k:"값",t:`${ind.value_col} (${ind.unit||"-"})`,txt:typeof REG[ind.no].v.find(x=>x!==null)==="string"},
      ...Object.keys(aux).map(k=>({k,t:k,txt:!(aux[k].some(x=>typeof x==="number"))}))];
    let rows=REGIONS.map((r,i)=>({i,지역:r.n,권역:r.a,값:REG[ind.no].v[i],
      ...Object.fromEntries(Object.keys(aux).map(k=>[k,aux[k][i]]))}));
    if(STATE.q){const q=STATE.q; rows=rows.filter(r=>r.지역.includes(q));}
    if(STATE.sort.col){
      const c=STATE.sort.col, d=STATE.sort.dir;
      rows.sort((a,b)=>{const x=a[c],y=b[c];
        if(typeof x==="number"&&typeof y==="number") return (x-y)*d;
        return String(x).localeCompare(String(y))*d;});
    } else rows.sort((a,b)=>(typeof b.값==="number"?b.값:-1e9)-(typeof a.값==="number"?a.값:-1e9));
    return {cols,rows,ind};
  }
  const d=DET[ind.no];
  if(!d) return {cols:[],rows:[],ind};
  const cols=d.cols.map((c,k)=>({k,t:c,txt:!["전용면적","세대수",ind.value_col].includes(c)}));
  let rows=d.rows.map((r,k)=>Object.fromEntries(d.cols.map((c,j)=>[c,r[j]])));
  if(STATE.q){const q=STATE.q; rows=rows.filter(r=>Object.values(r).some(v=>typeof v==="string"&&v.includes(q)));}
  const vc=ind.value_col;
  if(STATE.sort.col){
    const c=STATE.sort.col,d=STATE.sort.dir;
    rows.sort((a,b)=>{const x=a[c],y=b[c];
      if(typeof x==="number"&&typeof y==="number") return (x-y)*d;
      return String(x).localeCompare(String(y))*d;});
  } else if(d.cols.includes(vc)) rows.sort((a,b)=>(b[vc]??-1e9)-(a[vc]??-1e9));
  return {cols,rows,ind};
}

const PAGE=50;
function renderTable(){
  const ind=curInd();
  $("#tabReg").classList.toggle("on",STATE.view==="reg");
  $("#tabDet").classList.toggle("on",STATE.view==="det");
  const {cols,rows} = currentTable();
  const det=DET[ind.no];
  const covNum = (()=>{const m=String(ind.coverage||"").match(/(\d+)\s*\/\s*(\d+)/); return m?+m[1]/+m[2]:1;})();
  $("#covwarn").style.display = covNum<0.6?"block":"none";
  $("#covwarn").textContent = `이 지표는 원천 자료 범위가 좁습니다 — 커버리지 ${ind.coverage}. ${ind.note||""}`;
  $("#tblNote").textContent = STATE.view==="det"
    ? `단지·동 상세 ${(det?det.rows.length:0).toLocaleString()}행 내장${det&&det.capped?" (세대수 상위 기준)":""} · 지역 순위는 83개 지역 전체 기준`
    : `83개 지역 전체 · 값이 없는 지역은 "—"`;
  const head=$("#tbl thead"); head.innerHTML="";
  const tr=el("tr");
  cols.forEach(c=>{
    const th=el("th",c.txt?"txt":"",c.t);
    if(STATE.sort.col===c.k){th.classList.add("sorted"); if(STATE.sort.dir===1)th.classList.add("asc");}
    th.onclick=()=>{
      if(STATE.sort.col===c.k) STATE.sort.dir*=-1; else {STATE.sort.col=c.k;STATE.sort.dir=-1;}
      STATE.page=0; renderTable();
    };
    tr.appendChild(th);
  });
  head.appendChild(tr);
  const total=rows.length, pages=Math.max(1,Math.ceil(total/PAGE));
  STATE.page=Math.min(STATE.page,pages-1);
  const start=STATE.page*PAGE, slice=rows.slice(start,start+PAGE);
  const body=$("#tbl tbody"); body.innerHTML="";
  slice.forEach(row=>{
    const tr=el("tr");
    if(STATE.view==="reg" && row.i===STATE.r) tr.classList.add("sel");
    cols.forEach(c=>{
      const td=el("td",c.txt?"txt":"");
      const v=row[c.k];
      td.textContent = (c.k==="값"||c.k===ind.value_col)?fmtN(v,ind.unit,SIGNED.test(c.t)||SIGNED.test(ind.value_col)):
        (typeof v==="number"?(Math.abs(v)>=100?Math.round(v).toLocaleString():v.toFixed(2)):(v||"—"));
      tr.appendChild(td);
    });
    if(STATE.view==="reg"){tr.onclick=()=>{STATE.r=row.i;$("#regionSel").value=row.i;render();};}
    body.appendChild(tr);
  });
  $("#pager").innerHTML = `<span>${start+1}-${Math.min(start+PAGE,total)} / ${total.toLocaleString()}행</span>
    <button ${STATE.page<=0?"disabled":""} id="pgPrev">◀</button>
    <button ${STATE.page>=pages-1?"disabled":""} id="pgNext">▶</button>`;
  const p1=$("#pgPrev"), p2=$("#pgNext");
  if(p1) p1.onclick=()=>{STATE.page--;renderTable();};
  if(p2) p2.onclick=()=>{STATE.page++;renderTable();};
  window.__rows = rows; window.__cols = cols;
}

function download(name, blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
}
function saveCSV(){
  const {cols,rows}=currentTable(); const ind=curInd();
  const head=cols.map(c=>`"${c.t}"`).join(",");
  const lines=rows.map(r=>cols.map(c=>{const v=r[c.k]; return typeof v==="string"?`"${v.replace(/"/g,'""')}"`:(v===null||v===undefined?"":v);}).join(","));
  download(`ind${String(ind.no).padStart(2,"0")}_${curReg().n}.csv`,
    new Blob(["\ufeff"+[head,...lines].join("\n")],{type:"text/csv;charset=utf-8"}));
}
function savePNG(){
  const svg=$("#chart").querySelector("svg"); if(!svg) return;
  const ind=curInd(), r=curReg();
  const vb=svg.getAttribute("viewBox").split(" ").map(Number), W=vb[2], H=vb[3], S=2;
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width",W); clone.setAttribute("height",H);
  const bg=document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("width",W); bg.setAttribute("height",H); bg.setAttribute("fill","#ffffff");
  clone.insertBefore(bg,clone.firstChild);
  const head=document.createElementNS("http://www.w3.org/2000/svg","text");
  head.setAttribute("x",16); head.setAttribute("y",H-6); head.setAttribute("font-size",11);
  head.setAttribute("fill","#8b93a1");
  head.textContent=`#${ind.no} ${ind.name} · ${r.n} · 기준일 ${M.date} · 지표 50선`;
  clone.appendChild(head);
  const xml=new XMLSerializer().serializeToString(clone);
  const img=new Image();
  img.onload=()=>{
    const cv=document.createElement("canvas"); cv.width=W*S; cv.height=H*S;
    const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>download(`ind${String(ind.no).padStart(2,"0")}_${r.n}.png`,b),"image/png");
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(xml);
}
init();
</script>
</body>
</html>
